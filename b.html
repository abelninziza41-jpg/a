<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
    <style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;

        background-image: url("amahoro.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        display: flex;
        justify-content: center;
        align-items: center;

        height: 100vh;
    }


    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background: rgba(17, 129, 163, 0.5);
        z-index: -1;
    }


    .container {
        width: 420px;
        background-color: rgba(247, 250, 250, 0.95);
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0px 0px 12px rgba(0, 0, 0, 0.4);
    }


    h1 {
        text-align: center;
        color: darkgreen;
        margin-bottom: 20px;
    }


    form {
        display: flex;
        flex-direction: column;
    }


    label {
        margin-top: 15px;
        font-weight: bold;
        color: #333;
    }

    input,
    select {
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #999;
        border-radius: 5px;
        font-size: 15px;
    }

    button {
        margin-top: 25px;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background-color: rgb(32, 9, 245);
        color: rgb(212, 9, 9);
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: green;
    }

    #output {
        margin-top: 25px;
    }

    .invoice-card {
        background-color: #e8f5e9;
        padding: 15px;
        border-radius: 8px;
        border-left: 5px solid darkgreen;
    }

    .error {
        background-color: #ffebee;
        color: red;
        padding: 12px;
        border-radius: 5px;
        font-weight: bold;
    }

    .form{
        color: rgb(233, 22, 92);
        background-color: chartreuse;
        width: 300px;
        height: 400px;
        text-align: center;
        border-radius: 20px;
       

    }
    h2{
        color:chartreuse;
    }
    select{
        width: 210px;
    }
    </style>
    </head>
<body>
    <h1> <img src="amahoro.png" width="200pxl" heigth="200pxl"></h1>
    <h2>AMAHORO MILK COLLECTION CENETER</h2>
    <div class="form">
    Farmer's name:  <br>
    <input type="text" placeholder="enter farmer name "> <br>
        liters Delivered: <br>
        <input type="text" placeholder="Enter Liters delivered"> <br>
        Milk Quality price: <br>
        <select name="" id="">
            <option value="" required>super Premium Price (700frw per liter)</option>
            <option value="">Standard Price (500frw per liter) </option>
            <option value=""> low price Price (350frw per liter ) </option>
        </select>
        <div class="b">
            <button>Make an Order of milk </button>
        </div>
    </div>
</body>
</html>
